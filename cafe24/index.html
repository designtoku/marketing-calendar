<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>카페24 연결</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1f2328;--sub:#59636e;--line:#d8dee4;--ok:#1f8a52}
  @media (prefers-color-scheme:dark){:root{--bg:#15181c;--card:#1d2126;--ink:#e6e8eb;--sub:#9aa4ae;--line:#30363d;--ok:#4cc38a}}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  main{max-width:560px;margin:48px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
  h1{font-size:18px;margin:0 0 8px}
  p{margin:8px 0;color:var(--sub)}
  code{display:block;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;color:var(--ink);margin:12px 0}
  button{border:0;border-radius:8px;padding:10px 16px;background:var(--ink);color:var(--card);font-size:14px;cursor:pointer}
  .ok{color:var(--ok);font-weight:600;margin-left:8px}
</style>
</head>
<body>
<main><div class="card" id="box">
  <h1>카페24 연결 페이지</h1>
  <p>아이땅 마케팅 캘린더가 카페24 주문 합계를 읽기 위한 연결 페이지입니다.</p>
</div></main>
<script>
  // 승인 코드는 이 브라우저 화면에만 보여 주고 어디로도 보내지 않는다.
  var q = new URLSearchParams(location.search), code = q.get("code"), err = q.get("error"), box = document.getElementById("box");
  if (code) {
    box.innerHTML = '<h1>승인 코드가 발급되었습니다</h1><p>아래 코드를 복사해서 안내받은 파일에 붙여넣어 주세요. 코드는 잠시 후 만료되니 바로 진행해 주세요.</p><code id="c"></code><button id="b">코드 복사</button><span class="ok" id="m"></span><p>채팅에는 붙여넣지 마세요.</p>';
    document.getElementById("c").textContent = code;
    document.getElementById("b").onclick = function () {
      navigator.clipboard.writeText(code).then(function () { document.getElementById("m").textContent = "복사됨"; });
    };
    history.replaceState(null, "", location.pathname);
  } else if (err) {
    box.innerHTML = '<h1>승인이 완료되지 않았습니다</h1><p id="e"></p>';
    document.getElementById("e").textContent = err + (q.get("error_description") ? " · " + q.get("error_description") : "");
  }
</script>
</body>
</html>
